name: Release

# Push a tag like v0.2.0 (or v0.2.0-win.1 for a pre-release) on a master commit and the Windows
# installer is built on Windows and attached to a new GitHub Release of that name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (it must exist and be on master)
        required: true

permissions:
  contents: read

# a tag push and a manual run for the same tag must not race to create the release
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    # a manual run uses master's copy of this file, never a branch's
    if: github.event_name == 'push' || github.ref == 'refs/heads/master'
    # hosted, as ci.yml's jobs are: free on a public repository, and a release no longer waits for our
    # own machine to be awake. A self-hosted runner must not serve a public repository — ci.yml's
    # windows job says why.
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write # only the last step uses it (gh release create)
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    # bash for every step, not pwsh: pwsh fails a step only on its last command's exit code, so a failed
    # build went unnoticed as long as electron-builder then found something to pack.
    #
    # `shell: bash` is looked up on PATH, and on a self-hosted Windows runner that can find System32's
    # bash.exe — the WSL shim — instead of Git Bash. Naming the path here does not work: the runner
    # cannot parse a custom shell whose path contains spaces ("Second path fragment must not be a drive
    # or UNC name"). So the runner's own PATH has to put Git first; README says how.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # origin/master, for the check below
          persist-credentials: false # no token in .git/config while npm ci and the build run

      - name: The tag is a version tag on master
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is not a vX.Y.Z tag"; exit 1; }
          git merge-base --is-ancestor HEAD origin/master || { echo "::error::$TAG is not on master"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Version from the tag
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"

      # bash -e, not pwsh: pwsh fails a step only on its last command's exit code, so a failed build
      # went unnoticed as long as electron-builder then found something to pack
      - name: Build the installer
        run: |
          npx electron-vite build
          npx electron-builder --win --x64 --publish never

      # a checksum beside the installer: it is not code-signed, so this is how a download can be checked
      # against what CI built
      - name: Checksums
        run: (cd release && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # One call: gh creates it as a draft, uploads, then publishes (which also works with immutable
      # releases on). It fails if a release for this tag exists, so a published installer is never
      # replaced under the same name.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" release/*.exe release/SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "Fleetboard $TAG" \
            --notes "Windows installer: download **Fleetboard-Setup-${TAG#v}.exe** below and run it (it installs for your user only; Windows SmartScreen may warn because the installer isn't code-signed: More info → Run anyway). Then install and sign in to your agent CLIs (Claude Code, Codex, Gemini…) in Windows."
