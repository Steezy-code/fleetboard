name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# the default for a token is whatever the repository settings say, which may include write. Nothing
# here needs more than reading the code.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install (Electron + node-pty built for it)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # the same sources again with noUncheckedIndexedAccess, over the directories that have been
      # through it (tsconfig.strict.json's include list says which)
      - name: Typecheck (noUncheckedIndexedAccess, migrated directories)
        run: npm run typecheck:strict

      - name: Unit tests
        run: npm test

      # after the tests on purpose: this one talks to the registry, and a hiccup there must not hide
      # whether the code is sound. A known-vulnerable dependency should fail the build rather than
      # wait to be noticed; moderate and below are reported without failing, since several of those
      # advisories are denial-of-service in a build tool this app does not ship.
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

      - name: Dependency audit (full, advisory only)
        if: always()
        run: npm audit || true

      - name: Display server for the end-to-end tests
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots

      - name: Screenshots of the end-to-end runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore

  windows:
    # the platform layer for real: PowerShell consoles, .cmd agents, process trees, the installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (node-pty uses its prebuilt Windows binary)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx electron-vite build

      - name: Windows end-to-end
        run: node --enable-source-maps --import ./test/support/register.mjs --test --test-concurrency=1 test/e2e/windows.test.ts test/e2e/smoke.test.ts
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots

      - name: Screenshots of the end-to-end runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-windows
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore

      - name: Installer
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: fleetboard-windows-installer
          path: release/*.exe
          if-no-files-found: error
