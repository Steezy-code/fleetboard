name: CI

# A branch with a pull request open used to run all of this twice over, once for the push and once
# for the pull request, because the two have different refs and so different concurrency groups.
# The pull request run covers the branch; push covers what lands.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request makes its older run moot; on master every push is checked, since a
# cancelled run there is a commit nobody ever saw go green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# the default for a token is whatever the repository settings say, which may include write. Nothing
# here needs more than reading the code.
permissions:
  contents: read

jobs:
  checks:
    # The Linux half, on our own machine. GitHub's hosted runners are billing-blocked, and this is the
    # ground Windows cannot cover (26 of the 28 end-to-end files and 8 unit files), so it runs where it
    # already runs for us when developing: the container behind `npm run test:linux`. Typecheck, lint
    # and the audit are platform-independent and run natively on the runner; only the suites need Linux.
    #
    # ponytail: this needs Docker up in the runner's own logon session, which is the ceiling. Putting
    # `runs-on: ubuntu-24.04` back, with npm ci / typecheck / lint / unit / xvfb / test:e2e as plain
    # steps, is the way back the moment hosted minutes work again.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (Electron + node-pty built for it)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # the same sources again with noUncheckedIndexedAccess, over the directories that have been
      # through it (tsconfig.strict.json's include list says which)
      - name: Typecheck (noUncheckedIndexedAccess, migrated directories)
        run: npm run typecheck:strict

      # errors only. The React Compiler rules and exhaustive-deps are warnings on purpose: this project
      # does not use the compiler, and every one of those findings needs a judgement a linter cannot
      # make. A gate that cries wolf is one people learn to ignore.
      - name: Lint
        run: npm run lint

      # before the suites, unlike the hosted job: the container run is the long pole, and a registry
      # hiccup should not cost forty minutes to discover.
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

      # `|| true` would need bash; this runner's default shell is PowerShell, where `true` is not a command
      - name: Dependency audit (full, advisory only)
        if: always()
        run: npm audit; exit 0

      # a pull request arrives as a detached merge commit that no branch in this clone names. The
      # container clones from here and checks that commit out by hash, so give it a ref to arrive by.
      - name: Name the commit under test
        run: git branch -f ci-under-test HEAD

      # xvfb and the GTK libraries live inside the container, so none of this reaches the screen of the
      # machine the runner is on.
      #
      # ponytail: the container's screenshots leave with it on --rm, so a Linux e2e failure here has no
      # artifact to look at — the output names the sandbox it kept. Mount a volume for E2E_SHOTS when
      # one actually matters.
      - name: Linux unit and end-to-end tests, in a container
        run: npm run test:linux
        env:
          FB_E2E_JOBS: 3

  windows:
    # the platform layer for real: PowerShell consoles, .cmd agents, process trees, the installer.
    # On our own machine: a Windows runner bills at twice the rate of a Linux one, and this job is the
    # half that cannot be checked anywhere else. Self-hosted minutes are free, so this is the expensive
    # half for nothing, and the Linux job stays on GitHub's runners where it is a clean environment
    # every time. The cost is that the job waits for that machine to be on; `windows-latest` here
    # instead puts it back on a hosted runner.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (node-pty uses its prebuilt Windows binary)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx electron-vite build

      - name: Windows end-to-end
        run: node --enable-source-maps --import ./test/support/register.mjs --test --test-concurrency=1 test/e2e/windows.test.ts test/e2e/smoke.test.ts
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
          # keep the app off the screen: this runner shares a logon session with whoever is using the machine
          FB_E2E_HEADLESS: "1"

      - name: Screenshots of the end-to-end runs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-windows
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 7

      # Packaging is checked on master, since electron-builder fails in ways the build does not, but the
      # installer is not kept: release.yml builds the one users get, and at ~240 MB a copy per push
      # filled the account's artifact storage until master itself went red on the upload.
      - name: Installer
        if: github.ref == 'refs/heads/master'
        run: npx electron-builder --win --x64 --publish never
